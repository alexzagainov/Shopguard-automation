[pytest]
# --base-url = the site under test, page.goto("/") opens it. Set here and not as "base_url = ..." because
# pytest-xdist workers (-n) don't get that ini setting. Another --base-url on the command line overrides it.
addopts = --screenshot only-on-failure --tracing retain-on-failure --base-url https://automationexercise.com

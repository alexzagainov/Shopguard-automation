name: UI tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest tests -n 4 --alluredir=allure-results

      # the steps below run even when tests fail, so the report shows what failed
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline@2.46.1 generate allure-results -o allure-report --clean

      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  # publishes the report from main to https://alexzagainov.github.io/Shopguard-automation/
  publish-report:
    needs: tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
